name: update-lists

on:
  schedule:
    - cron: "17 4 * * *" # 04:17 UTC, ежедневно
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-lists
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Проверить списки и обновить подсети Anthropic
        run: node scripts/update-lists.mjs

      - name: Закоммитить изменения
        run: |
          if git diff --quiet; then
            echo "Изменений нет"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: refresh Anthropic IPv4 prefixes from RIPE Stat"
          git push
